; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = 
	secrets.ini

[common]
debug_flags =
	-DMQTT_CHANNEL_STATE=${secrets.MQTT_CHANNEL_STATE}
	-DMQTT_CHANNEL_SET=${secrets.MQTT_CHANNEL_SET}
	-DMQTT_CLIENT_NAME=${secrets.MQTT_CLIENT_NAME}
	-DWIFI_SSID=${secrets.WIFI_SSID}
	-DWIFI_PASS=${secrets.WIFI_PASS}
	-DMQTT_HOST=${secrets.MQTT_HOST}
	-DMQTT_USER=${secrets.MQTT_USER}
	-DMQTT_PASS=${secrets.MQTT_PASS}
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.15.5
	lovyan03/LovyanGFX@^1.2.21
	knolleary/PubSubClient@^2.8
build_type = ${secrets.BUILD_TYPE}

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
debug_tool = esp-builtin
build_type = ${common.build_type}
build_flags = ${common.debug_flags}

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps = ${common.lib_deps}                                                                                                                                                                     
build_type = ${common.build_type}
build_flags = ${common.debug_flags}

[env:esp32]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}
build_type = ${common.build_type}
build_flags = ${common.debug_flags}